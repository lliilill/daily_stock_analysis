name: 텔레그램 종목 관리

on:
  schedule:
    # KST 07:07 09:07 12:07 15:07 17:37 18:37 21:07 23:07 (each run listens ~9 min).
    # Fewer fixed times instead of every 10 min: GitHub skipped most 10-min runs.
    - cron: '7 22,0,3,6,12,14 * * *'
    - cron: '37 8,9 * * *'   # 17:37 and 18:37 KST, before the 19:00 report
  workflow_dispatch:

concurrency:
  group: telegram-stock-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # start the analysis workflow for /analyze

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Handle Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_VARIABLES_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          BOT_RUN_SECONDS: '540'   # keep listening ~9 min so buttons answer quickly
        run: python3 scripts/telegram_stock_bot.py
