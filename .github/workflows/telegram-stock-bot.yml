name: 텔레그램 종목 관리

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:

concurrency:
  group: telegram-stock-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Handle Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_VARIABLES_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
        run: python3 scripts/telegram_stock_bot.py
